<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 128" role="img" aria-labelledby="title desc">
  <title id="title">Animated systems network</title>
  <desc id="desc">A restrained animated network of orbiting nodes around a central system core.</desc>
  <style>
    .track { fill: none; stroke: #8c959f; stroke-opacity: .18; stroke-width: 1; }
    .link { stroke: #8c959f; stroke-opacity: .14; stroke-width: 1; }
    .core-ring { fill: none; stroke: #4493f8; stroke-opacity: .34; stroke-width: 1; }
    .core { fill: #4493f8; }
    .node { fill: #8c959f; }
    .signal { fill: #4493f8; }
    .orbit-a { transform-origin: 480px 64px; animation: orbit 24s linear infinite; }
    .orbit-b { transform-origin: 480px 64px; animation: orbit-reverse 34s linear infinite; }
    .orbit-c { transform-origin: 480px 64px; animation: orbit 44s linear infinite; }
    .pulse { animation: pulse 4.8s ease-in-out infinite; transform-origin: 480px 64px; }
    @keyframes orbit { to { transform: rotate(360deg); } }
    @keyframes orbit-reverse { to { transform: rotate(-360deg); } }
    @keyframes pulse { 0%, 100% { opacity: .25; transform: scale(.92); } 50% { opacity: .7; transform: scale(1.08); } }
    @media (prefers-color-scheme: dark) {
      .track, .link { stroke: #8b949e; }
      .node { fill: #8b949e; }
      .core, .signal { fill: #58a6ff; }
      .core-ring { stroke: #58a6ff; }
    }
    @media (prefers-reduced-motion: reduce) {
      .orbit-a, .orbit-b, .orbit-c, .pulse { animation: none; }
    }
  </style>

  <line class="link" x1="160" y1="64" x2="800" y2="64" />
  <circle class="node" cx="160" cy="64" r="2.5" opacity=".45" />
  <circle class="node" cx="800" cy="64" r="2.5" opacity=".45" />

  <ellipse class="track" cx="480" cy="64" rx="92" ry="22" />
  <ellipse class="track" cx="480" cy="64" rx="148" ry="35" />
  <ellipse class="track" cx="480" cy="64" rx="212" ry="48" />

  <circle class="core-ring pulse" cx="480" cy="64" r="17" />
  <circle class="core" cx="480" cy="64" r="4" />

  <g class="orbit-a">
    <line class="link" x1="480" y1="64" x2="572" y2="64" />
    <circle class="signal" cx="572" cy="64" r="3.2" />
  </g>

  <g class="orbit-b">
    <line class="link" x1="480" y1="64" x2="332" y2="64" />
    <circle class="node" cx="332" cy="64" r="3" />
  </g>

  <g class="orbit-c">
    <line class="link" x1="480" y1="64" x2="692" y2="64" />
    <circle class="node" cx="692" cy="64" r="2.8" />
  </g>
</svg>
