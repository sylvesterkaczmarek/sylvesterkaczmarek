name: Update merged contribution count

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/update-merged-contributions.yml"

permissions:
  contents: write

concurrency:
  group: merged-contribution-count
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Count merged upstream contributions and update README
        uses: actions/github-script@v8
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            // GitHub excludes contributions from organizations that have blocked a user.
            // Excluding mi6 also avoids Search API permission resolution failures caused by
            // that organization while keeping the counter aligned with GitHub's accounting.
            const query = `is:pr author:${owner} is:merged -org:mi6`;

            const searchPublicly = async (page) => {
              const url = new URL("https://api.github.com/search/issues");
              url.searchParams.set("q", query);
              url.searchParams.set("per_page", "100");
              url.searchParams.set("page", String(page));

              const response = await fetch(url, {
                headers: {
                  Accept: "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "User-Agent": "merged-contribution-count",
                },
              });

              if (!response.ok) {
                throw new Error(
                  `Public GitHub search failed with ${response.status}: ${await response.text()}`,
                );
              }

              return response.json();
            };

            const merged = [];
            let usePublicSearch = false;

            for (let page = 1; page <= 10; page += 1) {
              let data;

              if (!usePublicSearch) {
                try {
                  const response = await github.rest.search.issuesAndPullRequests({
                    q: query,
                    per_page: 100,
                    page,
                  });
                  data = response.data;
                } catch (error) {
                  if (error.status !== 422) {
                    throw error;
                  }

                  core.warning(
                    "Authenticated GitHub search rejected the author qualifier; retrying with public search.",
                  );
                  usePublicSearch = true;
                }
              }

              if (usePublicSearch) {
                data = await searchPublicly(page);
              }

              const items = data.items ?? [];
              merged.push(...items);

              if (items.length < 100 || merged.length >= data.total_count) {
                break;
              }
            }

            const ownerPrefix = `/repos/${owner.toLowerCase()}/`;
            const count = merged.filter((pr) => {
              const repositoryPath = new URL(pr.repository_url).pathname.toLowerCase();
              return !repositoryPath.startsWith(ownerPrefix);
            }).length;

            const path = "README.md";
            const file = await github.rest.repos.getContent({ owner, repo, path });
            if (Array.isArray(file.data) || !file.data.content || !file.data.sha) {
              throw new Error("README.md did not resolve to a writable file");
            }

            const current = Buffer.from(file.data.content, "base64").toString("utf8");
            const marker = /<!-- merged-contributions:start -->[\s\S]*?<!-- merged-contributions:end -->/;
            if (!marker.test(current)) {
              throw new Error("Merged-contribution markers are missing from README.md");
            }

            const replacement = [
              "<!-- merged-contributions:start -->",
              `**${count} merged contributions**`,
              "<!-- merged-contributions:end -->",
            ].join("\n");
            const next = current.replace(marker, replacement);

            if (next === current) {
              core.info(`Merged contribution count is already ${count}`);
              return;
            }

            await github.rest.repos.createOrUpdateFileContents({
              owner,
              repo,
              path,
              message: `chore: update merged contribution count to ${count}`,
              content: Buffer.from(next, "utf8").toString("base64"),
              sha: file.data.sha,
            });

            core.info(`Updated merged contribution count to ${count}`);
