name: Update merged contribution count

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/update-merged-contributions.yml"

permissions:
  contents: write

concurrency:
  group: merged-contribution-count
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Count merged upstream contributions and update README
        uses: actions/github-script@v8
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const ownerLower = owner.toLowerCase();

            // Do not use GitHub's site-wide Search API here. Private profiles are
            // excluded from site-wide activity search, which can make an author:
            // query fail with HTTP 422 even though the account and PRs still exist.
            // Query the user's pull-request connection directly instead.
            const query = `
              query($login: String!, $cursor: String) {
                user(login: $login) {
                  pullRequests(
                    first: 100
                    after: $cursor
                    states: [MERGED]
                    orderBy: { field: CREATED_AT, direction: ASC }
                  ) {
                    nodes {
                      repository {
                        owner {
                          login
                        }
                      }
                    }
                    pageInfo {
                      hasNextPage
                      endCursor
                    }
                  }
                }
              }
            `;

            let cursor = null;
            let count = 0;

            for (let page = 1; page <= 100; page += 1) {
              const result = await github.graphql(query, {
                login: owner,
                cursor,
              });

              if (!result.user) {
                throw new Error(`GitHub user ${owner} could not be resolved`);
              }

              const connection = result.user.pullRequests;
              for (const pr of connection.nodes ?? []) {
                const repositoryOwner = pr.repository?.owner?.login?.toLowerCase();
                if (repositoryOwner && repositoryOwner !== ownerLower) {
                  count += 1;
                }
              }

              if (!connection.pageInfo.hasNextPage) {
                break;
              }

              cursor = connection.pageInfo.endCursor;
              if (!cursor) {
                throw new Error("GitHub returned another PR page without an end cursor");
              }

              if (page === 100) {
                throw new Error("Merged PR pagination exceeded the 10,000-item safety limit");
              }
            }

            const path = "README.md";
            const file = await github.rest.repos.getContent({ owner, repo, path });
            if (Array.isArray(file.data) || !file.data.content || !file.data.sha) {
              throw new Error("README.md did not resolve to a writable file");
            }

            const current = Buffer.from(file.data.content, "base64").toString("utf8");
            const marker = /<!-- merged-contributions:start -->[\s\S]*?<!-- merged-contributions:end -->/;
            if (!marker.test(current)) {
              throw new Error("Merged-contribution markers are missing from README.md");
            }

            const replacement = [
              "<!-- merged-contributions:start -->",
              `**${count} merged contributions**`,
              "<!-- merged-contributions:end -->",
            ].join("\n");
            const next = current.replace(marker, replacement);

            if (next === current) {
              core.info(`Merged contribution count is already ${count}`);
              return;
            }

            await github.rest.repos.createOrUpdateFileContents({
              owner,
              repo,
              path,
              message: `chore: update merged contribution count to ${count}`,
              content: Buffer.from(next, "utf8").toString("base64"),
              sha: file.data.sha,
            });

            core.info(`Updated merged contribution count to ${count}`);
