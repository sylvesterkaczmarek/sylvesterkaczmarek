name: Update open-source metrics

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/update-merged-contributions.yml"

permissions:
  contents: write

concurrency:
  group: open-source-metrics
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check profile search token
        id: profile-token
        shell: bash
        env:
          PROFILE_GITHUB_TOKEN: ${{ secrets.PROFILE_GITHUB_TOKEN }}
        run: |
          if [ -z "$PROFILE_GITHUB_TOKEN" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::PROFILE_GITHUB_TOKEN is not configured; leaving open-source metrics unchanged."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Count merged upstream PRs, repositories, and reviewed PRs
        if: steps.profile-token.outputs.configured == 'true'
        uses: actions/github-script@v8
        env:
          PROFILE_GITHUB_TOKEN: ${{ secrets.PROFILE_GITHUB_TOKEN }}
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            async function searchPullRequests(query, label) {
              const results = [];

              for (let page = 1; page <= 10; page += 1) {
                const url = new URL("https://api.github.com/search/issues");
                url.searchParams.set("q", query);
                url.searchParams.set("per_page", "100");
                url.searchParams.set("page", String(page));

                const response = await fetch(url, {
                  headers: {
                    Accept: "application/vnd.github+json",
                    Authorization: `Bearer ${process.env.PROFILE_GITHUB_TOKEN}`,
                    "X-GitHub-Api-Version": "2022-11-28",
                    "User-Agent": "open-source-profile-metrics",
                  },
                });

                if (!response.ok) {
                  throw new Error(
                    `${label} search failed with ${response.status}: ${await response.text()}`,
                  );
                }

                const data = await response.json();
                const items = data.items ?? [];
                results.push(...items);

                if (items.length < 100 || results.length >= data.total_count) {
                  break;
                }

                if (page === 10) {
                  throw new Error(`${label} search exceeded the 1,000-result Search API limit`);
                }
              }

              return results;
            }

            // A private GitHub profile is excluded from site-wide activity search for
            // anonymous callers and the repository-scoped GITHUB_TOKEN. Authenticate
            // searches as the profile owner, while keeping GITHUB_TOKEN for the
            // README write below.
            const merged = await searchPullRequests(
              `is:pr author:${owner} is:merged`,
              "Merged PR",
            );
            const reviewed = await searchPullRequests(
              `is:pr reviewed-by:${owner}`,
              "Reviewed PR",
            );

            const ownerPrefix = `/repos/${owner.toLowerCase()}/`;
            const isUpstream = (pr) => {
              const repositoryPath = new URL(pr.repository_url).pathname.toLowerCase();
              return !repositoryPath.startsWith(ownerPrefix);
            };

            const upstream = merged.filter(isUpstream);
            const upstreamReviewed = reviewed.filter(isUpstream);

            const mergedCount = upstream.length;
            const repositoryCount = new Set(
              upstream.map((pr) => new URL(pr.repository_url).pathname.toLowerCase()),
            ).size;
            const reviewedCount = new Set(
              upstreamReviewed.map((pr) => {
                const repositoryPath = new URL(pr.repository_url).pathname.toLowerCase();
                return `${repositoryPath}#${pr.number}`;
              }),
            ).size;
            const repositoryLabel = repositoryCount === 1 ? "repository" : "repositories";

            const path = "README.md";
            const file = await github.rest.repos.getContent({ owner, repo, path });
            if (Array.isArray(file.data) || !file.data.content || !file.data.sha) {
              throw new Error("README.md did not resolve to a writable file");
            }

            const current = Buffer.from(file.data.content, "base64").toString("utf8");
            const marker = /<!-- merged-contributions:start -->[\s\S]*?<!-- merged-contributions:end -->/;
            if (!marker.test(current)) {
              throw new Error("Merged-contribution markers are missing from README.md");
            }

            const replacement = [
              "<!-- merged-contributions:start -->",
              `**${mergedCount} merged upstream PRs across ${repositoryCount} upstream ${repositoryLabel} · ${reviewedCount} distinct upstream PRs reviewed**`,
              "<!-- merged-contributions:end -->",
            ].join("\n");
            const next = current.replace(marker, replacement);

            if (next === current) {
              core.info(
                `Open-source metrics are already ${mergedCount} merged upstream PRs across ${repositoryCount} upstream ${repositoryLabel} · ${reviewedCount} distinct upstream PRs reviewed`,
              );
              return;
            }

            await github.rest.repos.createOrUpdateFileContents({
              owner,
              repo,
              path,
              message: `chore: update open-source metrics`,
              content: Buffer.from(next, "utf8").toString("base64"),
              sha: file.data.sha,
            });

            core.info(
              `Updated open-source metrics to ${mergedCount} merged upstream PRs across ${repositoryCount} upstream ${repositoryLabel} · ${reviewedCount} distinct upstream PRs reviewed`,
            );
